# =============================================================================
# W5Base — Apache 2.4 + mod_perl2 (prefork MPM) virtual host
# Containerized local development environment (NET-NEW, additive).
#
# Realizes the patterns in etc/httpd/perl.conf.mod_perl2 and etc/httpd/httpd24.conf
# with the container install root rebased to /opt/w5base. This file REFERENCES
# (never edits) sbin/ApacheStartup.pl and bin/app.pl.
#
# Consumed at BUILD time by the root Dockerfile (COPY into the Apache config tree
# and enable via a2ensite/a2enconf). NOT rendered by the entrypoint.
#
# NOTE: mod_perl2 requires the PREFORK MPM. This vhost does not switch the MPM;
# the Dockerfile must: a2dismod mpm_event mpm_worker ; a2enmod mpm_prefork perl
# rewrite proxy alias mime authn_core authn_file authz_user auth_basic.
#
# NO SECRETS in this file. Basic-auth credentials live in /etc/w5base/htpasswd,
# written at runtime by docker/entrypoint.sh from ${W5BASE_ADMIN}/${W5BASE_ADMIN_PASSWORD};
# the htpasswd username must equal MASTERADMIN in /etc/w5base/w5base.conf.
# =============================================================================

# --- (1) mod_perl preload contract (server scope) --------------------------
# Mirrors etc/httpd/perl.conf.mod_perl2 but rebased to INSTDIR /opt/w5base.
# Apache::DBI is preloaded before any DBI use for connection pooling; the
# <Perl> section sets $W5V2::INSTDIR and requires the repo's preload script,
# which prepends /opt/w5base/mod and /opt/w5base/lib to @INC and loads the
# base kernel modules. sbin/ApacheStartup.pl is NEVER modified.
PerlModule Apache::DBI
<Perl>
  $W5V2::INSTDIR="/opt/w5base";
  require $W5V2::INSTDIR.'/sbin/ApacheStartup.pl';
</Perl>

<VirtualHost *:80>
    ServerName localhost

    # Logs go to /var/log/w5base (created by docker/entrypoint.sh). No secrets.
    ErrorLog  /var/log/w5base/apache_error.log
    CustomLog /var/log/w5base/apache_access.log combined

    # --- (2) Aliases + rewrite (from etc/httpd/httpd24.conf, INSTDIR=/opt/w5base)
    ProxyRequests off

    Alias /w5base/bin/    /opt/w5base/bin/
    Alias /w5base/auth/   /opt/w5base/bin/
    Alias /w5base/public/ /opt/w5base/bin/
    Alias /w5base/static/ /opt/w5base/static/
    Alias /favicon.ico    /opt/w5base/static/

    ErrorDocument 401 /w5base/public/base/menu/root?OpenUrl=LoginFail

    RewriteEngine on
    RewriteRule ^/favicon.ico$ /w5base/public/base/load/icon_w5base.ico
    RewriteRule ^.*/([^/]+)/(public|auth)/([^/]+)/([^/]+)/(.+)$ /$1/$2/app.pl?MOD=$3::$4&FUNC=$5 [QSA,PT]

    # --- (3) Handler Location blocks (perl-script via ModPerl::Registry) -----
    <Location /w5base/auth>
        Options -Indexes -FollowSymLinks +ExecCGI -Includes
        AddHandler perl-script .pl
        PerlResponseHandler ModPerl::Registry
        PerlSendHeader On
    </Location>

    <Location /w5base/public>
        Options -Indexes -FollowSymLinks +ExecCGI -Includes
        AddHandler perl-script .pl
        PerlResponseHandler ModPerl::Registry
        PerlSendHeader On
        Require all granted
    </Location>

    <Location /w5base/static>
        Require all granted
    </Location>

    # --- (4) Minimal HTTP Basic auth on /w5base/auth ------------------------
    # Replaces the excluded acache/mod_auth_ae provider. Delegated auth model:
    # Apache validates the password and passes REMOTE_USER; the kernel elevates
    # to admin when REMOTE_USER == MASTERADMIN. No aeAccountToLower; no LDAP/OIDC/Oracle.
    <Location /w5base/auth>
        AuthType Basic
        AuthName "W5Base Login"
        AuthBasicProvider file
        AuthUserFile /etc/w5base/htpasswd
        Require valid-user
    </Location>

</VirtualHost>
